[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harvey"
version = "0.2.0"
description = "Financial research agent with intent-tagged memory (STITCH) and a Rich TUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
harvey = "harvey.cli.app:main"

[tool.setuptools.packages.find]
include = ["harvey*"]
